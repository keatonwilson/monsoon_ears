[project]
name = "monsoon-ears"
version = "0.1.0"
description = "Multi-agent SDR radio intelligence pipeline for Tucson emergency frequencies."
requires-python = ">=3.11"
readme = "README.md"
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "sqlmodel>=0.0.16",
    "pydantic>=2.6",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
# Pi-only: hardware capture + Whisper. Torch wheel is Linux/arm64/macOS-arm,
# so Intel-Mac dev installs without this group.
pi = [
    # Pin pyrtlsdr to the 0.3.x line: 0.4.0 calls rtlsdr_set_dithering, which
    # isn't in the librtlsdr shipped by Raspberry Pi OS (Debian Trixie).
    "pyrtlsdr>=0.3.0,<0.4.0",
    "openai-whisper>=20231117",
    "aprs3>=8.0",
]
dev = [
    "pytest>=8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["ingestion", "models", "db", "config"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
