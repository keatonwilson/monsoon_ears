[project]
name = "monsoon-ears"
version = "0.1.0"
description = "Multi-agent SDR radio intelligence pipeline for Tucson emergency frequencies."
requires-python = ">=3.11"
readme = "README.md"
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "sqlmodel>=0.0.16",
    "pydantic>=2.6",
    "python-dotenv>=1.0",
    # Phase 03 — agent pipeline. Cross-platform deps.
    "langgraph>=0.2.0",
    "anthropic>=0.40.0",
    "instructor>=1.5.0",
    "geopy>=2.4",
    "requests>=2.31",
    "apscheduler>=3.10",
    # Phase 04 — read API + dashboard.
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "streamlit>=1.38",
    "folium>=0.17",
    "streamlit-folium>=0.22",
    "streamlit-autorefresh>=1.0",
    "altair>=5.4",
    "pandas>=2.2",
    "sqlglot>=25.0",
    "httpx>=0.27",
]

[project.optional-dependencies]
# Pi-only: hardware capture + Whisper. Torch wheel is Linux/arm64/macOS-arm,
# so Intel-Mac dev installs without this group.
pi = [
    # Pin pyrtlsdr to the 0.3.x line: 0.4.0 calls rtlsdr_set_dithering, which
    # isn't in the librtlsdr shipped by Raspberry Pi OS (Debian Trixie).
    "pyrtlsdr>=0.3.0,<0.4.0",
    "openai-whisper>=20231117",
    "webrtcvad>=2.0.10",
    "aprslib>=0.7",
]
dev = [
    "pytest>=8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["ingestion", "models", "db", "config", "agents", "api", "dashboard"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
